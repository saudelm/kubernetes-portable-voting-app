name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate Helm and Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Helm lint
        run: helm lint charts/voting-app

      - name: Helm template
        run: helm template voting charts/voting-app --namespace voting

      - name: Terraform fmt
        run: terraform -chdir=infra/onprem-k3d fmt -check

      - name: Terraform init
        run: terraform -chdir=infra/onprem-k3d init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/onprem-k3d validate

  images:
    name: Build application images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: vote
            context: vote
          - component: result
            context: result
          - component: worker
            context: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ github.sha }}
