{{- $components := list "vote" "result" "worker" "redis" "postgres" -}}
{{- range $component := $components }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "voting-app.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "voting-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "voting-app.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "voting-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "voting-app.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "voting-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
subjects:
  - kind: ServiceAccount
    name: {{ include "voting-app.serviceAccountName" (dict "root" $ "component" $component) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "voting-app.serviceAccountName" (dict "root" $ "component" $component) }}
---
{{- end }}
