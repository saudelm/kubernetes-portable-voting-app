name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Helm and Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Helm lint
        run: helm lint charts/voting-app --set-string postgres.password=static-test-not-a-credential

      - name: Helm template
        run: helm template voting charts/voting-app --namespace voting --set-string postgres.password=static-test-not-a-credential

      - name: Helm template (GKE values)
        run: >-
          helm template voting charts/voting-app --namespace voting
          -f charts/voting-app/values-gke.yaml
          --set-string postgres.password=static-test-not-a-credential
          --set-string vote.image.tag=abcdef1
          --set-string result.image.tag=abcdef1
          --set-string worker.image.tag=abcdef1
          --set-string vote.ingress.host=vote.192.0.2.1.nip.io
          --set-string result.ingress.host=result.192.0.2.1.nip.io

      - name: Terraform fmt
        run: terraform -chdir=infra/onprem-k3d fmt -check

      - name: Terraform init
        run: terraform -chdir=infra/onprem-k3d init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/onprem-k3d validate

      - name: Terraform fmt (GKE)
        run: terraform -chdir=infra/gke fmt -check

      - name: Terraform init (GKE)
        run: terraform -chdir=infra/gke init -backend=false

      - name: Terraform validate (GKE)
        run: terraform -chdir=infra/gke validate

      - name: Portability comparison
        run: |
          ruby scripts/tests/test_portability.rb
          ruby scripts/compare-portability.rb --output "$RUNNER_TEMP/adaptation-matrix"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: result/package-lock.json

      - name: Validate result application dependencies
        working-directory: result
        run: |
          npm ci --ignore-scripts
          npm test
          npm audit --omit=dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: vote/requirements.txt

      - name: Validate vote application
        run: |
          python -m pip install -r vote/requirements.txt
          python -m py_compile vote/app.py
          python -m unittest discover -s vote/tests -p 'test_*.py'

      - name: Validate evidence runner
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

  images:
    name: Build application images
    needs: validate
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: vote
            context: vote
          - component: result
            context: result
          - component: worker
            context: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          labels: org.opencontainers.image.revision=${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ github.sha }}
