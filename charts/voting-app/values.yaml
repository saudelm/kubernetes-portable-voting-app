nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

vote:
  replicaCount: 2
  image:
    repository: voting-vote
    tag: local
    pullPolicy: IfNotPresent
  options:
    a: Cats
    b: Dogs
  service:
    port: 80
  ingress:
    enabled: true
    className: traefik
    host: vote.127.0.0.1.nip.io
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

result:
  replicaCount: 2
  image:
    repository: voting-result
    tag: local
    pullPolicy: IfNotPresent
  service:
    port: 80
  ingress:
    enabled: true
    className: traefik
    host: result.127.0.0.1.nip.io
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

worker:
  replicaCount: 1
  image:
    repository: voting-worker
    tag: local
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  image:
    repository: redis
    tag: 7.4.9-alpine
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  image:
    repository: postgres
    tag: 16.14-bookworm
    pullPolicy: IfNotPresent
  service:
    port: 5432
  user: postgres
  # Supply externally, e.g. --set-file postgres.password=/private/path/password.
  password: ""
  database: postgres
  storage:
    size: 1Gi
    # Optional: StorageClass der Zielumgebung. Bleibt der Wert leer,
    # greift die Standard-StorageClass (lokal: local-path von k3s).
    className: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: true
  allowNodeLocalDns: false
  healthProbeCidrs: []

ingressController:
  namespace: traefik
